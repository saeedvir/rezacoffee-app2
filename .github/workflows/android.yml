name: Build & Release RezaCoffee Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build RezaCoffee APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew is missing."
            exit 1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar is missing."
            exit 1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties is missing."
            exit 1
          fi

          chmod +x gradlew

          echo "Gradle Wrapper files:"
          ls -lah gradlew
          ls -lah gradle/wrapper/

      - name: Check Gradle Version
        run: ./gradlew --version

      - name: Clean Project
        run: ./gradlew clean --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Debug APK
        run: |
          mkdir -p output-apks

          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          cp app/build/outputs/apk/debug/app-debug.apk \
             output-apks/RezaCoffee-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RezaCoffee-Debug-APK
          path: output-apks/RezaCoffee-debug.apk
          retention-days: 30

      # ---------------------------------------------------------
      # Release
      # ---------------------------------------------------------

      - name: Validate Release Secrets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            missing=1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            missing=1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            missing=1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Decode Release Keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks

          if [ ! -s "app/release-keystore.jks" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "Release keystore created successfully."

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_PATH: "release-keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "Release APK:"
          ls -lh "$APK"

      - name: Check APK Architecture
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          echo "APK native libraries:"
          unzip -l "$APK" | grep "lib/" || true

      - name: Prepare Release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p output-apks

          cp app/build/outputs/apk/release/app-release.apk \
             output-apks/RezaCoffee-release.apk

      - name: Upload Release APK Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: RezaCoffee-Release-APK
          path: output-apks/RezaCoffee-release.apk
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output-apks/RezaCoffee-release.apk
            output-apks/RezaCoffee-debug.apk
          generate_release_notes: true
          name: "RezaCoffee App ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## ☕ RezaCoffee Android App

            اپلیکیشن رسمی فروشگاه قهوه رضا

            - Website: https://rezacoffee.ir/
            - Version: `${{ github.ref_name }}`
            - Minimum Android: Android 7.0 (API 24)
            - Target Android: API 34
            - Java: 17

            ### Files

            - `RezaCoffee-release.apk` — نسخه اصلی برای مشتریان
            - `RezaCoffee-debug.apk` — نسخه آزمایشی توسعه‌دهندگان
