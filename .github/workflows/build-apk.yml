name: Build & Release RezaCoffee Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_title:
        description: 'عنوان نسخه (اختیاری)'
        required: false
        default: 'انتشار دستی APK'

permissions:
  contents: write

jobs:
  build:
    name: Build APKs & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      # بیلد نسخه اشکال‌زدایی (Debug APK) - بدون نیاز به کلید امضا
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # اعتبارسنجی و دیکود کردن فایل کلید امضا در صورت تعریف در Secrets
      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret detected. Decoding to app/release-keystore.jks..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          else
            echo "Note: KEYSTORE_BASE64 is empty or not set. Release APK will be assembled without custom keystore."
          fi

      # بیلد نسخه نهایی (Release APK)
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: "S@eedab1"
          KEY_ALIAS: "rezacoffee"
          KEY_PASSWORD: "S@eedab1"
          KEYSTORE_BASE64: "MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAv/ETHX4luiO4jI9kfZDS
uMnZeWPOTp2IIFiQjGwemMO9vOzIhPWW5DrGTFmhcJY7OPhkbHObUJVYz4TDmoIj
VsxsCTW1vZ7rlffX+jOgKbbL8CSgz7OgAV3c+5AhJY/4ZdA7uVVllOB12IbaffHc
gMq2JQ3ZS7EhwSTBwq13EIoVbtoieMRb8IqCqz/UhITpK0udHfGgTXTHZaCmN6g6
T7PfP70C+4xTfbHtFIW9EfO7hhioJcswA34s12P2sBMxZDnJd3hJAFpHP36LNUs2
choPw2i7iWd3cQ4zhRGScGRMk4fb+zO7CECWNg3a4tiKGx+Uzk8cKhY0dAlRGOCO
TwIDAQAB"

      # تغییر نام فایل‌های خروجی برای شفافیت در دانلود
      - name: Prepare APK Outputs
        run: |
          mkdir -p output-apks
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk output-apks/RezaCoffee-release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output-apks/RezaCoffee-debug.apk
          fi

      # ذخیره خروجی‌ها در آرتیفکت‌های گیت‌هاب برای دانلود تا ۳۰ روز
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RezaCoffee-Debug-APK
          path: output-apks/RezaCoffee-debug.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('output-apks/RezaCoffee-release.apk') != '' }}
        with:
          name: RezaCoffee-Release-APK
          path: output-apks/RezaCoffee-release.apk
          retention-days: 30

      # ساخت خودکار Release در گیت‌هاب هنگام ارسال Tag نسخه (مثلاً v1.0.0)
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output-apks/*.apk
          generate_release_notes: true
          name: "RezaCoffee App ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## ☕ اپلیکیشن رسمی اندروید فروشگاه قهوه رضا (RezaCoffee)
            - **وب‌سایت رسمی:** https://rezacoffee.ir/
            - **نسخه انتشار:** `${{ github.ref_name }}`
            - **حداقل اندروید پشتیبانی شده:** اندروید 7.0 نوقا (API 24) به بالا
            - **فایل‌های پیوست:**
              - `RezaCoffee-release.apk`: نسخه اصلی امضا شده جهت نصب توسط مشتریان
              - `RezaCoffee-debug.apk`: نسخه دیباگ جهت بررسی توسعه‌دهندگان
