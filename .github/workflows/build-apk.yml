```yaml
name: RezaCoffee Android CI & Release

on:
  push:
    branches:
      - main

    tags:
      - "v*"

  pull_request:

  workflow_dispatch:
    inputs:
      release_title:
        description: "عنوان نسخه (اختیاری)"
        required: false
        default: "انتشار دستی APK"

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  ANDROID_PLATFORM: "34"
  BUILD_TOOLS_VERSION: "34.0.0"

jobs:

  # ============================================================
  # TEST
  # ============================================================

  test:
    name: Unit Tests

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Source Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Java
      # --------------------------------------------------------

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # --------------------------------------------------------
      # Gradle
      # --------------------------------------------------------

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Validate Gradle Wrapper
        run: ./gradlew --version

      # --------------------------------------------------------
      # Android SDK
      # --------------------------------------------------------

      - name: Setup Android SDK
        run: |
          set -euo pipefail

          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager \
            -type f \
            | sort \
            | tail -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS_VERSION}"

      # --------------------------------------------------------
      # Unit Tests
      # --------------------------------------------------------

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest \
            --stacktrace \
            --no-daemon

      # --------------------------------------------------------
      # Test Reports
      # --------------------------------------------------------

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RezaCoffee-Test-Report
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14


  # ============================================================
  # BUILD
  # ============================================================

  build:
    name: Build Android APK

    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Java
      # --------------------------------------------------------

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # --------------------------------------------------------
      # Gradle
      # --------------------------------------------------------

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Validate Gradle Wrapper
        run: ./gradlew --version

      # --------------------------------------------------------
      # Android SDK
      # --------------------------------------------------------

      - name: Setup Android SDK
        run: |
          set -euo pipefail

          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager \
            -type f \
            | sort \
            | tail -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS_VERSION}"

      # --------------------------------------------------------
      # Gradle environment
      # --------------------------------------------------------

      - name: Validate Gradle Environment
        run: |
          ./gradlew --version
          ./gradlew tasks --no-daemon

      # --------------------------------------------------------
      # Clean
      # --------------------------------------------------------

      - name: Clean Project
        run: |
          ./gradlew clean \
            --stacktrace \
            --no-daemon

      # ========================================================
      # DEBUG APK
      # ========================================================

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      # ========================================================
      # RELEASE KEYSTORE
      # ========================================================

      - name: Validate Release Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: KEYSTORE_BASE64 is not configured."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is not configured."
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: KEY_ALIAS is not configured."
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: KEY_PASSWORD is not configured."
            exit 1
          fi

          echo "All release signing secrets are configured."

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

        run: |
          set -euo pipefail

          mkdir -p app

          echo "$KEYSTORE_BASE64" \
            | base64 --decode \
            > app/release-keystore.jks

          if [ ! -s app/release-keystore.jks ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "Release keystore created successfully."

      # ========================================================
      # RELEASE APK
      # ========================================================

      - name: Build Release APK
        env:
          KEYSTORE_PATH: "release-keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          ./gradlew assembleRelease \
            --stacktrace \
            --no-daemon

      # ========================================================
      # VERIFY APK
      # ========================================================

      - name: Verify APK Files
        run: |
          set -euo pipefail

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

          echo "========================================"
          echo "APK FILE CHECK"
          echo "========================================"

          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"

          echo ""
          echo "Debug APK:"
          ls -lh "$DEBUG_APK"

          echo ""
          echo "Release APK:"
          ls -lh "$RELEASE_APK"

      # ========================================================
      # APK METADATA
      # ========================================================

      - name: Inspect Release APK
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          AAPT="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/aapt"

          echo "========================================"
          echo "APK PACKAGE INFORMATION"
          echo "========================================"

          "$AAPT" dump badging "$APK" \
            | grep -E \
              "package:|sdkVersion:|targetSdkVersion:|supports-screens:"

          echo ""
          echo "========================================"
          echo "APK FEATURES"
          echo "========================================"

          "$AAPT" dump badging "$APK" \
            | grep "uses-feature:" || true

          echo ""
          echo "========================================"
          echo "APK ABIs / NATIVE LIBRARIES"
          echo "========================================"

          unzip -l "$APK" \
            | grep -E \
              "lib/(armeabi-v7a|arm64-v8a|x86|x86_64)/" \
            || echo "No native libraries found."

      # ========================================================
      # VERIFY SIGNATURE
      # ========================================================

      - name: Verify APK Signature
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/apksigner"

          echo "========================================"
          echo "APK SIGNATURE"
          echo "========================================"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

      # ========================================================
      # PREPARE OUTPUT
      # ========================================================

      - name: Prepare APK Outputs
        run: |
          set -euo pipefail

          mkdir -p output-apks

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output-apks/RezaCoffee-debug.apk

          cp \
            app/build/outputs/apk/release/app-release.apk \
            output-apks/RezaCoffee-release.apk

          echo "========================================"
          echo "FINAL APK FILES"
          echo "========================================"

          ls -lh output-apks/

      # ========================================================
      # UPLOAD DEBUG
      # ========================================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RezaCoffee-Debug-APK
          path: output-apks/RezaCoffee-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ========================================================
      # UPLOAD RELEASE
      # ========================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RezaCoffee-Release-APK
          path: output-apks/RezaCoffee-release.apk
          if-no-files-found: error
          retention-days: 30

      # ========================================================
      # GITHUB RELEASE
      # ========================================================

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2

        with:
          files: |
            output-apks/RezaCoffee-release.apk
            output-apks/RezaCoffee-debug.apk

          generate_release_notes: true

          name: "RezaCoffee App ${{ github.ref_name }}"

          draft: false
          prerelease: false

          body: |
            ## ☕ RezaCoffee Android App

            اپلیکیشن رسمی فروشگاه قهوه رضا

            **وب‌سایت:**
            https://rezacoffee.ir/

            **نسخه:**
            `${{ github.ref_name }}`

            ### سازگاری

            - Minimum Android: 7.0 / API 24
            - Target Android: API 34
            - Java: 17

            ### فایل‌ها

            - `RezaCoffee-release.apk`
              نسخه اصلی برای نصب کاربران

            - `RezaCoffee-debug.apk`
              نسخه آزمایشی برای توسعه‌دهندگان

            ### امکانات

            - پشتیبانی از زبان فارسی و RTL
            - Pull-to-Refresh
            - مدیریت قطعی اینترنت
            - اتصال به سرویس‌های فروشگاه
            - پشتیبانی از درگاه پرداخت
```
